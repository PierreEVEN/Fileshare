[package]
name = "fileshare-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12.7", features = ["json", "stream"] }
serde = "1.0.219"
serde_json = "1.0.61"
serde_derive = "1.0.119"
tokio = { version = "1.0.2", features = ["full"] }
clap = { version = "4.5.16", features = ["derive"] }
anyhow = "1.0.89"
paris = { version = "1.5", features = ["macros"] }
indicatif = "0.17.8"
rpassword = "7.3.1"
gethostname = "1.0.2"
mime_guess = "2.0.5"
pathdiff = "0.2.1"
futures-util = "0.3.30"
path-clean = "1.0.1"
async-stream = "0.3.5"
tokio-util = "0.7.11"

types = {path = "../types"}