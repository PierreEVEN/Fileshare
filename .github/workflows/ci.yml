name: Build app

on:
  push:
    tags:
      - '**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build_rust_linux:
    name: Linux - Rust app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@main
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-rust-linux
          retention-days: 1
          path: |
            ./migrations/*
            ./target/release/fileshare-cli
            ./target/release/fileshare-server

  build-f3d-alpine:
    runs-on: ubuntu-latest
    container: alpine:3.21

    steps:
      - name: Install dependencies
        run: |
          apk update
          apk --no-cache add build-base cmake ninja git vtk-dev assimp-dev alembic-dev openexr-dev mesa mesa-dri-gallium mesa-osmesa mesa-egl

      - name: Clone f3d repository
        run: git clone https://github.com/f3d-app/f3d.git src

      - name: Build executable with musl
        run: |
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DF3D_MODULE_EXR=OFF -DF3D_MODULE_UI=OFF -DF3D_MODULE_TINYFILEDIALOGS=OFF -DF3D_PLUGIN_BUILD_ASSIMP=ON -DF3D_PLUGIN_BUILD_ALEMBIC=ON ../src
          ninja -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-f3d-linux_musl
          retention-days: 1
          path: |
            ./build/bin
            ./build/lib

  build_rust_linux_musl:
    name: Linux Musl - Rust app
    runs-on: ubuntu-22.04
    container: ghcr.io/blackdex/rust-musl:x86_64-musl
    steps:
      - uses: actions/checkout@v4
      - run:  cargo build --release --package fileshare-server
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-rust-linux_musl
          retention-days: 1
          path: |
            ./migrations/*
            ./target/x86_64-unknown-linux-musl/release/fileshare-server
            
  build_rust_windows:
    name: Windows - Rust app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-rust-windows
          retention-days: 1
          path: |
            ./migrations/*
            ./target/release/fileshare-cli.exe
            ./target/release/fileshare-server.exe

  build_web_app:
    name: Web app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@main
      - working-directory: ./web_client
        run: npm install
      - working-directory: ./web_client
        run: npm run prod
      - uses: actions/upload-artifact@main
        with:
          name: webapp-artifact
          retention-days: 1
          path: ./web_client/public/*

  package:
    name: Upload release
    runs-on: ubuntu-22.04
    needs: [build_rust_windows, build_rust_linux, build_rust_linux_musl, build_web_app, build-f3d-alpine]
    steps:
      - uses: actions/checkout@v4
        
      # Create Docker setup zip
      - run: mv docker fileshare-dockerized
      - run: zip -r fileshare-dockerized.zip ./fileshare-dockerized/

      # Download generated f3d exec
      - name: Retrieve artifact f3d musl
        uses: actions/download-artifact@main
        with:
          name: artifact-f3d-linux_musl
          path: ./artifact_f3d_linux

      - run: ls -lah ./artifact_f3d_linux


      # Download generated webapp data
      - name: Retrieve artifact Web app
        uses: actions/download-artifact@main
        with:
          name: webapp-artifact
          path: ./artifact_web_app/public

      # Create Linux server zip
      - name: Retrieve artifact Rust/Linux
        uses: actions/download-artifact@main
        with:
          name: artifact-rust-linux
          path: ./artifact_rust_linux

      - run: mkdir fileshare
      - run: mkdir fileshare/migrations
      - run: mv ./artifact_rust_linux/migrations/* ./fileshare/migrations
      - run: mv ./artifact_rust_linux/target/release/fileshare-server ./fileshare/
      - run: cp -r ./artifact_web_app/* ./fileshare/
      - run: zip -r fileshare_server_linux.zip ./fileshare/
      - run: rm -r ./fileshare

      # Create Linux Musl server zip
      - name: Retrieve artifact Rust/Linux
        uses: actions/download-artifact@main
        with:
          name: artifact-rust-linux_musl
          path: ./artifact_rust_linux_musl

      - run: mkdir fileshare
      - run: mkdir fileshare/migrations
      - run: mkdir fileshare/f3d
      - run: cp -r ./artifact_f3d_linux/* ./fileshare/f3d
      - run: mv ./artifact_rust_linux_musl/migrations/* ./fileshare/migrations
      - run: mv ./artifact_rust_linux_musl/target/x86_64-unknown-linux-musl/release/fileshare-server ./fileshare/
      - run: cp -r ./artifact_web_app/* ./fileshare/
      - run: zip -r fileshare_server_linux_musl.zip ./fileshare/
      - run: rm -r ./fileshare

      # Create Windows server zip
      - name: Retrieve artifact Rust/Windows
        uses: actions/download-artifact@main
        with:
          name: artifact-rust-windows
          path: ./artifact_rust_windows

      - run: mkdir fileshare
      - run: mkdir fileshare/migrations
      - run: mv ./artifact_rust_windows/migrations/* ./fileshare/migrations
      - run: mv ./artifact_rust_windows/target/release/fileshare-server.exe ./fileshare/
      - run: cp -r ./artifact_web_app/* ./fileshare/
      - run: zip -r fileshare_server_windows.zip ./fileshare/
      - run: rm -r ./fileshare

      # Create Linux client zip
      - run: mkdir fileshare
      - run: mv ./artifact_rust_linux/target/release/fileshare-cli ./fileshare/fileshare
      - run: zip -r fileshare_cli_linux.zip ./fileshare/
      - run: rm -r ./fileshare

      # Create Windows client zip
      - run: mkdir fileshare
      - run: mv ./artifact_rust_windows/target/release/fileshare-cli.exe ./fileshare/fileshare.exe
      - run: zip -r fileshare_cli_windows.zip ./fileshare/
      - run: rm -r ./fileshare

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            fileshare_server_linux.zip
            fileshare_server_linux_musl.zip
            fileshare_server_windows.zip
            fileshare_cli_linux.zip
            fileshare_cli_windows.zip
            fileshare-dockerized.zip
